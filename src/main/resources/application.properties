spring.application.name=assistente-financas-ia

# --- Spring AI / OpenAI ---
# A chave vem da variável de ambiente OPENAI_API_KEY (nunca coloque a chave no código).
# O valor padrão abaixo só existe para a aplicação e os testes subirem sem chave;
# as chamadas à IA só funcionam com uma chave real.
spring.ai.openai.api-key=${OPENAI_API_KEY:chave-nao-configurada}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.audio.transcription.options.model=${OPENAI_TRANSCRIPTION_MODEL:whisper-1}
spring.ai.openai.audio.transcription.options.language=pt

# --- Upload de áudio ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Banco em memória (H2) ---
spring.datasource.url=jdbc:h2:mem:financas
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
